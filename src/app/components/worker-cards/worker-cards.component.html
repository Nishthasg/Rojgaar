<div class="card p-3">
<div class="d-flex gap-3">
<div class="img-wrapper">
    <img src="../../../assets/Images/home.jpg" alt="Worker img" height="80" width="80">
</div>
<div class="title">
    <h5>{{worker.user.name}}</h5>
    <p class="text-primary">{{worker.category}}</p>
    <p>
        <i class="bi bi-geo-alt"></i>
        {{worker.city}}, {{worker.state}}
    </p>
</div>
<div class="rating ms-auto">
    <i class="bi bi-star-fill text-warning"></i>
    <span>4.1</span>
</div>
</div>
<div class="mt-2">
 <p class="text-muted">{{worker.bio}}</p>
 <div class="worker-skill d-flex gap-3 text-muted">
    <p *ngFor="let skill of worker.skills | slice:0:3">
    {{ skill }}
  </p>

  <p *ngIf="worker.skills?.length > 3">
    +{{ worker.skills.length - 3 }}
  </p>
 </div>
 <hr>
</div>
<div class="d-flex justify-content-between">
<p><span class="text-muted">Experience:</span>{{worker.experience}}</p>
<button class="btn btn-primary" (click)="viewProfile(worker._id)">View Profile</button>
</div>
</div>
