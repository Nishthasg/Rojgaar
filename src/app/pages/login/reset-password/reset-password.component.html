
<div class="login-container">
    <div class="container-heading">
        <h2 class="text-center">Reset Password</h2>
    </div>
     <p class="m-3">Enter your email address and we'll send you a link to reset your password.</p>
    <form [formGroup]="password" (ngSubmit)="resetPassword()">
        <div class="form-group">
           <label>New Password</label>
           <input type="password" placeholder="Enter your new password" class="form-control" formControlName="newpassword" required>
        </div>
        <div class="form-group">
           <label>Confirm Password</label>
           <input type="password" placeholder="Confirm your new password" class="form-control" formControlName="confirmpassword" required>
        </div>
        <div class="mt-4 d-flex justify-content-end">
            <button class="btn btn-primary" type="submit">Submit</button>
        </div>
    </form>
</div>
