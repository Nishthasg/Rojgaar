
<div class="login-container">
    <div class="container-heading">
        <h2 class="text-center">Forgot Password</h2>
    </div>
     <p class="m-3">Enter your email address and we'll send you a link to reset your password.</p>
    <form (ngSubmit)="sendResetLink()">
        <div class="form-group">
           <label>Email Address</label>
           <input type="email" placeholder="Enter your email" class="form-control" [(ngModel)]="email" name="email" required>
        </div>
        <div class="mt-4 d-flex justify-content-end">
            <button class="btn btn-primary" type="submit">Submit</button>
        </div>
    </form>
</div>
